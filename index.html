<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Form Builder AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#0078D4',
              'brand-secondary': '#F3F2F1',
              'brand-accent': '#005A9E',
              'brand-text': '#323130',
              'brand-light-gray': '#EDEBE9',
            },
            boxShadow: {
              'lifted': '0 4px 12px 0 rgba(0, 0, 0, 0.07), 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
            },
            animation: {
              'fade-in-staggered': 'fadeIn 0.4s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(5px)' },
                '100%': { opacity: '1', transform: 'translateY(0px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Enhance placeholder contrast */
      ::placeholder {
        color: #6b7280 !important; /* gray-500 */
        opacity: 1;
      }
      /* Custom scrollbar for better UI */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #999;
      }
      /* Focus ring for accessibility */
      :focus-visible {
        outline: 2px solid #0078D4;
        outline-offset: 2px;
      }
      /* Invalid state feedback */
      .form-control:invalid {
        border-color: #ef4444; /* red-500 */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "papaparse": "https://esm.sh/papaparse@5.4.1",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs"
  }
}
</script>
</head>
  <body class="bg-brand-secondary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
